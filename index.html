<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>表情花園</title>

  <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>

  <style>
    :root {
      --green: #3f9d67;
      --dark-green: #246344;
      --cream: #fff9e9;
      --pink: #ff7193;
      --purple: #8067d8;
      --red: #e55353;
      --shadow: 0 12px 35px rgba(46, 87, 57, 0.18);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Noto Sans TC", Arial, sans-serif;
      color: var(--dark-green);
      background:
        radial-gradient(circle at 20% 10%, #ffffff 0 8%, transparent 9%),
        linear-gradient(135deg, #d7f5d8, #fff1c9);
    }

    .app {
      width: min(1100px, 94%);
      margin: 0 auto;
      padding: 24px 0 40px;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(2rem, 5vw, 3.8rem);
      color: #27744e;
    }

    .subtitle {
      margin: 0;
      font-size: 1.05rem;
    }

    .privacy {
      margin: 12px auto 0;
      max-width: 700px;
      padding: 10px 14px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.75);
      font-size: 0.9rem;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(280px, 0.9fr) minmax(320px, 1.1fr);
      gap: 20px;
      align-items: stretch;
    }

    .card {
      background: rgba(255, 255, 255, 0.82);
      border-radius: 24px;
      padding: 20px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(8px);
    }

    .camera-card {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .video-wrap {
      position: relative;
      overflow: hidden;
      border-radius: 20px;
      background: #173a2d;
      aspect-ratio: 4 / 3;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
      display: block;
    }

    .camera-placeholder {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 20px;
      color: white;
      text-align: center;
      background: linear-gradient(135deg, #397d5c, #7ebd79);
    }

    .camera-placeholder.hidden {
      display: none;
    }

    .expression {
      padding: 12px 16px;
      border-radius: 15px;
      background: #f1fae8;
      text-align: center;
      font-weight: 700;
      min-height: 48px;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    button {
      border: 0;
      border-radius: 14px;
      padding: 12px 18px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      color: white;
      background: var(--green);
      transition: transform 0.15s, filter 0.15s;
    }

    button:hover:not(:disabled) {
      transform: translateY(-2px);
      filter: brightness(1.06);
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    #pauseBtn {
      background: var(--purple);
    }

    #restartBtn {
      background: #e09b3c;
    }

    .game-card {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .stat {
      text-align: center;
      padding: 10px 6px;
      border-radius: 15px;
      background: #f8f4db;
    }

    .stat strong {
      display: block;
      font-size: 1.4rem;
      color: #397b4d;
    }

    .garden {
      position: relative;
      overflow: hidden;
      min-height: 380px;
      border-radius: 22px;
      background:
        radial-gradient(circle at 20% 20%, rgba(255,255,255,.8) 0 3%, transparent 4%),
        radial-gradient(circle at 80% 30%, rgba(255,255,255,.65) 0 2%, transparent 3%),
        linear-gradient(#a9e4e0 0 55%, #8ed17d 56% 100%);
      border: 8px solid rgba(255,255,255,.65);
    }

    .garden::before {
      content: "☁️       ☁️";
      position: absolute;
      top: 18px;
      left: 0;
      width: 100%;
      text-align: center;
      font-size: 2rem;
      opacity: .85;
    }

    .garden::after {
      content: "🌿  🌱  🌿  🌱  🌿  🌱  🌿";
      position: absolute;
      bottom: 8px;
      left: 0;
      width: 100%;
      text-align: center;
      font-size: 2rem;
    }

    .object {
      position: absolute;
      z-index: 2;
      bottom: 48px;
      font-size: 3rem;
      animation: bloom .7s ease-out both;
      user-select: none;
    }

    .flower {
      filter: drop-shadow(0 5px 4px rgba(40, 90, 42, .25));
    }

    .bomb {
      animation: bombIn .35s ease-out both;
    }

    .explosion {
      animation: explode .85s ease-out both;
    }

    .shake {
      animation: shake .32s ease-in-out;
    }

    .help {
      margin: 0;
      font-size: .94rem;
      line-height: 1.6;
    }

    .error {
      display: none;
      padding: 12px 15px;
      border-radius: 14px;
      color: #8d2e2e;
      background: #ffe0e0;
      line-height: 1.5;
    }

    .error.show {
      display: block;
    }

    @keyframes bloom {
      0% {
        transform: translateY(35px) scale(.1) rotate(-20deg);
        opacity: 0;
      }
      70% {
        transform: translateY(-8px) scale(1.2) rotate(8deg);
        opacity: 1;
      }
      100% {
        transform: translateY(0) scale(1) rotate(0);
      }
    }

    @keyframes bombIn {
      0% {
        transform: scale(.2) rotate(-25deg);
        opacity: 0;
      }
      70% {
        transform: scale(1.2) rotate(8deg);
        opacity: 1;
      }
      100% {
        transform: scale(1) rotate(0);
      }
    }

    @keyframes explode {
      0% {
        transform: scale(.7);
        opacity: 1;
      }
      100% {
        transform: scale(2.4) rotate(20deg);
        opacity: 0;
      }
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-8px) rotate(-1deg); }
      75% { transform: translateX(8px) rotate(1deg); }
    }

    @media (max-width: 760px) {
      .layout {
        grid-template-columns: 1fr;
      }

      .garden {
        min-height: 300px;
      }

      .stats {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>

<body>
  <main class="app">
    <header>
      <h1>🌸 表情花園 💣</h1>
      <p class="subtitle">笑一笑，讓花朵盛開；皺眉頭，小心炸彈出現！</p>
      <div class="privacy">
        🔒 影像只在你的瀏覽器中進行辨識，不會上傳或儲存。
      </div>
    </header>

    <section class="layout">
      <div class="card camera-card">
        <div class="video-wrap">
          <video id="video" autoplay muted playsinline></video>
          <div id="placeholder" class="camera-placeholder">
            按下「開始遊戲」後，允許瀏覽器使用 webcam
          </div>
        </div>

        <div id="expression" class="expression">
          尚未開始，請準備好你的表情
        </div>

        <div id="error" class="error"></div>

        <div class="controls">
          <button id="startBtn">開始遊戲</button>
          <button id="pauseBtn" disabled>暫停</button>
          <button id="restartBtn" disabled>重新開始</button>
        </div>

        <p class="help">
          建議在光線充足的地方遊玩，並讓臉部完整出現在鏡頭中。
          笑臉會開花，生氣表情會產生卡通炸彈。
        </p>
      </div>

      <div class="card game-card">
        <div class="stats">
          <div class="stat">
            <strong id="score">0</strong>
            分數
          </div>
          <div class="stat">
            <strong id="flowers">0</strong>
            花朵
          </div>
          <div class="stat">
            <strong id="bombs">0</strong>
            炸彈
          </div>
          <div class="stat">
            <strong id="time">0</strong>
            秒
          </div>
        </div>

        <div id="garden" class="garden"></div>
      </div>
    </section>
  </main>

  <script>
    const MODEL_URL =
      "https://justadudewhohacks.github.io/face-api.js/models";

    const video = document.getElementById("video");
    const placeholder = document.getElementById("placeholder");
    const expression = document.getElementById("expression");
    const errorBox = document.getElementById("error");
    const garden = document.getElementById("garden");

    const startBtn = document.getElementById("startBtn");
    const pauseBtn = document.getElementById("pauseBtn");
    const restartBtn = document.getElementById("restartBtn");

    const scoreEl = document.getElementById("score");
    const flowersEl = document.getElementById("flowers");
    const bombsEl = document.getElementById("bombs");
    const timeEl = document.getElementById("time");

    let stream = null;
    let running = false;
    let paused = false;
    let detecting = false;
    let startTime = 0;
    let timer = null;

    let score = 0;
    let flowers = 0;
    let bombs = 0;

    let happyLocked = false;
    let angryLocked = false;

    const detectorOptions =
      new faceapi.TinyFaceDetectorOptions({
        inputSize: 320,
        scoreThreshold: 0.5
      });

    function showError(message) {
      errorBox.textContent = message;
      errorBox.classList.add("show");
    }

    function clearError() {
      errorBox.textContent = "";
      errorBox.classList.remove("show");
    }

    function updateStats() {
      scoreEl.textContent = score;
      flowersEl.textContent = flowers;
      bombsEl.textContent = bombs;
    }

    function setExpression(message) {
      expression.textContent = message;
    }

    async function loadModels() {
      await Promise.all([
        faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),
        faceapi.nets.faceExpressionNet.loadFromUri(MODEL_URL)
      ]);
    }

    async function startGame() {
      clearError();
      startBtn.disabled = true;
      setExpression("正在載入表情辨識模型…");

      try {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          throw new Error(
            "此瀏覽器不支援 webcam，請改用較新的 Chrome、Edge、Safari 或 Firefox。"
          );
        }

        await loadModels();

        stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: "user",
            width: { ideal: 640 },
            height: { ideal: 480 }
          },
          audio: false
        });

        video.srcObject = stream;
        await video.play();

        placeholder.classList.add("hidden");
        running = true;
        paused = false;
        startTime = Date.now();

        pauseBtn.disabled = false;
        restartBtn.disabled = false;
        pauseBtn.textContent = "暫停";
        startBtn.textContent = "遊戲進行中";

        setExpression("請對著鏡頭微笑，讓花朵盛開！");
        updateTimer();
        timer = setInterval(updateTimer, 1000);

        detectExpressions();
      } catch (error) {
        console.error(error);

        if (error.name === "NotAllowedError") {
          showError("你拒絕了 webcam 權限。請在瀏覽器網址列重新允許攝影機後，再重新整理頁面。");
        } else if (error.name === "NotFoundError") {
          showError("找不到攝影機，請確認 webcam 已連接並且沒有被其他程式占用。");
        } else {
          showError("啟動失敗：" + error.message);
        }

        startBtn.disabled = false;
        setExpression("尚未啟動");
      }
    }

    async function detectExpressions() {
      if (!running) return;

      if (!paused && !detecting && video.readyState >= 2) {
        detecting = true;

        try {
          const result = await faceapi
            .detectSingleFace(video, detectorOptions)
            .withFaceExpressions();

          if (!result) {
            setExpression("請將臉移到鏡頭範圍內");
            happyLocked = false;
            angryLocked = false;
          } else {
            const expressions = result.expressions;
            const happy = expressions.happy || 0;
            const angry = expressions.angry || 0;
            const neutral = expressions.neutral || 0;

            if (angry >= 0.72 && angry > happy) {
              setExpression("😠 偵測到生氣表情，小心炸彈！");
              if (!angryLocked) {
                createBomb();
                angryLocked = true;
              }
              happyLocked = false;
            } else if (happy >= 0.72) {
              setExpression("😊 偵測到笑臉，花朵盛開！");
              if (!happyLocked) {
                createFlower();
                happyLocked = true;
              }
              angryLocked = false;
            } else if (neutral >= 0.5) {
              setExpression("😐 中性表情，試著微笑或做出生氣表情");
              happyLocked = false;
              angryLocked = false;
            } else {
              setExpression("正在辨識你的表情…");
            }
          }
        } catch (error) {
          console.error(error);
          setExpression("表情辨識暫時失敗，請保持臉部清楚可見");
        }

        detecting = false;
      }

      setTimeout(detectExpressions, 650);
    }

    function createFlower() {
      const flower = document.createElement("div");
      flower.className = "object flower";
      flower.textContent = ["🌸", "🌼", "🌻", "🌷", "🌺"][
        Math.floor(Math.random() * 5)
      ];
      flower.style.left = `${10 + Math.random() * 80}%`;
      flower.style.bottom = `${45 + Math.random() * 25}px`;

      garden.appendChild(flower);

      flowers++;
      score += 10;
      updateStats();

      setTimeout(() => flower.remove(), 8000);
    }

    function createBomb() {
      const bomb = document.createElement("div");
      bomb.className = "object bomb";
      bomb.textContent = "💣";
      bomb.style.left = `${10 + Math.random() * 80}%`;
      bomb.style.bottom = `${45 + Math.random() * 25}px`;

      garden.appendChild(bomb);

      bombs++;
      score = Math.max(0, score - 5);
      updateStats();

      garden.classList.remove("shake");
      void garden.offsetWidth;
      garden.classList.add("shake");

      setTimeout(() => {
        bomb.textContent = "💥";
        bomb.classList.remove("bomb");
        bomb.classList.add("explosion");
      }, 500);

      setTimeout(() => bomb.remove(), 1300);
    }

    function updateTimer() {
      if (!running || paused) return;
      timeEl.textContent = Math.floor((Date.now() - startTime) / 1000);
    }

    function togglePause() {
      if (!running) return;

      paused = !paused;
      pauseBtn.textContent = paused ? "繼續遊戲" : "暫停";

      if (paused) {
        setExpression("遊戲已暫停");
      } else {
        setExpression("遊戲繼續，對著鏡頭做表情吧！");
        startTime = Date.now() - Number(timeEl.textContent) * 1000;
      }
    }

    function restartGame() {
      score = 0;
      flowers = 0;
      bombs = 0;
      happyLocked = false;
      angryLocked = false;
      startTime = Date.now();

      garden.querySelectorAll(".object").forEach((item) => item.remove());
      garden.classList.remove("shake");
      updateStats();

      if (paused) {
        paused = false;
        pauseBtn.textContent = "暫停";
      }

      setExpression("遊戲已重新開始，請展現你的表情！");
    }

    function stopCamera() {
      if (stream) {
        stream.getTracks().forEach((track) => track.stop());
      }
    }

    startBtn.addEventListener("click", startGame);
    pauseBtn.addEventListener("click", togglePause);
    restartBtn.addEventListener("click", restartGame);

    window.addEventListener("beforeunload", () => {
      clearInterval(timer);
      stopCamera();
    });
  </script>
</body>
</html>
